<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFB</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/png" href="WFB.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #aaa;
    }
    .card {
      width: 340px;
      background: #111;
      border: 1px solid #222;
      border-top: 2px solid #ff6b35;
      padding: 36px 32px 28px;
    }
    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #ff6b35;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 10px;
      color: #333;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #444;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #222;
      color: #ccc;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
    }
    input:focus { border-color: #ff6b35; }
    button {
      width: 100%;
      background: #1a0800;
      border: 1px solid #ff6b35;
      color: #ff6b35;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 4px;
    }
    button:hover { background: #2a1000; }
    #msg {
      font-size: 11px;
      color: #cc3a00;
      text-align: center;
      margin-top: 14px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">WFB</div>
    <label>Mã số</label>
    <input type="text" id="code" placeholder="Nhập mã số" autocomplete="off">
    <label>Mật khẩu</label>
    <input type="password" id="password" placeholder="Nhập mật khẩu">
    <button onclick="login()">Đăng nhập</button>
    <div id="msg"></div>
  </div>

  <script>
    var VALID_CODE = '23102210';
    var VALID_HASH = '813461e0c58e7ad59a2fd83ca2237fec';

    function login() {
      var code = document.getElementById('code').value.trim();
      var pass = document.getElementById('password').value;
      var msg  = document.getElementById('msg');

      if (!code || !pass) { msg.textContent = 'Vui lòng nhập đầy đủ thông tin.'; return; }
      if (code !== VALID_CODE) { msg.textContent = 'Mã số không đúng.'; return; }

      var hash = CryptoJS.MD5(pass).toString();
      if (hash !== VALID_HASH) { msg.textContent = 'Mật khẩu không đúng.'; return; }

      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('userEmail', code);
      localStorage.setItem('username', 'WFB');
      localStorage.setItem('passwordHash', hash);
      localStorage.setItem('userRole', 'admin');
      window.location.href = 'index.html';
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
    document.getElementById('code').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
