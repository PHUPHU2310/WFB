<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="60"/>
  <!-- Top accent bar (orange — WFB brand) -->
  <rect x="0" y="0" width="512" height="10" fill="#ff6b35" rx="60"/>
  <rect x="0" y="0" width="512" height="10" fill="#ff6b35"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="512" fill="#ff6b35"/>
  <!-- WFB main text -->
  <text x="256" y="310" font-family="'Courier New',Courier,monospace" font-size="188" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="-6">WFB</text>
  <!-- Divider line -->
  <rect x="64" y="340" width="384" height="2" fill="#2a2a2a"/>
  <!-- Subtitle -->
  <text x="256" y="390" font-family="monospace" font-size="32" font-weight="400"
        fill="#ff6b35" text-anchor="middle" letter-spacing="8">BUREAU</text>
  <!-- Bottom dot indicators (IDE-style status bar) -->
  <circle cx="180" cy="440" r="8" fill="#ff6b35" opacity="0.9"/>
  <circle cx="210" cy="440" r="8" fill="#ff9a35" opacity="0.6"/>
  <circle cx="240" cy="440" r="8" fill="#333" opacity="0.8"/>
  <text x="270" y="446" font-family="monospace" font-size="20" fill="#333" letter-spacing="2">ONLINE</text>
</svg>
